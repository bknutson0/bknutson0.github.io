<div class="feature-card{% if include.reverse %} feature-card--reverse{% endif %}">
  <a href="{{ include.project.url }}"><img src="{{ include.project.image }}" alt="{{ include.project.image_alt }}"></a>
  <div>
    <h3><a href="{{ include.project.url }}">{{ include.project.title }}</a></h3>
    {{ include.project.excerpt | markdownify }}
  </div>
  <p class="card-cue">Read the full story →</p>
</div>
